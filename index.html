<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課堂管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SheetJS Excel 匯出套件 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200"
      x-data="app()" x-init="initApp()">

  <!-- 未登入遮罩畫面 -->
  <div x-show="!user" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl space-y-4">
      <div class="text-5xl mb-2">📚</div>
      <h2 class="text-2xl font-bold">課堂管理系統</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">請使用 Google 帳號登入，系統將會即時雲端同步您的數據。</p>
      <button @click="loginGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg transition">
        <span>🔑 使用 Google 帳號登入</span>
      </button>
    </div>
  </div>

  <!-- 主介面 -->
  <div x-show="user">
    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <span class="text-2xl">📚</span>
          <h1 class="text-xl font-bold tracking-wide">課堂管理系統</h1>
        </div>

        <!-- 頁籤與操作功能 -->
        <div class="flex flex-wrap items-center gap-2">
          <nav class="flex bg-indigo-700 dark:bg-indigo-950 p-1 rounded-lg text-sm font-medium">
            <button @click="currentTab = 'homework'" :class="currentTab === 'homework' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-300 shadow' : 'text-white hover:text-indigo-200'" class="px-3 py-1.5 rounded-md transition">按功課管理</button>
            <button @click="currentTab = 'overview'" :class="currentTab === 'overview' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-300 shadow' : 'text-white hover:text-indigo-200'" class="px-3 py-1.5 rounded-md transition">學生整體總覽</button>
            <button @click="currentTab = 'quiz'" :class="currentTab === 'quiz' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-300 shadow' : 'text-white hover:text-indigo-200'" class="px-3 py-1.5 rounded-md transition">測驗成績分析</button>
            <button @click="currentTab = 'incidents'" :class="currentTab === 'incidents' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-300 shadow' : 'text-white hover:text-indigo-200'" class="px-3 py-1.5 rounded-md transition">📋 課堂紀錄</button>
          </nav>

          <button @click="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium shadow">📊 匯出 Excel</button>
          <button @click="toggleDarkMode()" class="bg-indigo-800 dark:bg-indigo-700 p-2 rounded-lg text-sm hover:bg-indigo-700 transition">
            <span x-text="isDarkMode ? '☀️' : '🌙'"></span>
          </button>
          <button @click="logoutGoogle()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-medium">登出</button>
        </div>
      </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
      
      <!-- 班別選擇、分數開關與班別管理 -->
      <div class="mb-6 flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 gap-3">
        <div class="flex items-center space-x-2">
          <span class="text-sm font-semibold text-slate-500 dark:text-slate-400">當前班別：</span>
          <template x-for="cls in classes" :key="cls">
            <button @click="currentClass = cls" 
                    :class="currentClass === cls ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200'"
                    class="px-3.5 py-1 rounded-lg font-medium text-sm transition" x-text="cls"></button>
          </template>
        </div>

        <div class="flex items-center space-x-3">
          <!-- 手動開啟功課分數功能 -->
          <label class="flex items-center space-x-2 text-xs font-medium cursor-pointer bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg">
            <input type="checkbox" x-model="enableHwsScores" @change="saveDataToFirebase()" class="rounded text-indigo-600 focus:ring-0">
            <span>開啟功課分數登記</span>
          </label>
          <button @click="showClassModal = true" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 py-1.5 rounded-lg font-medium">⚙️ 班別管理</button>
        </div>
      </div>

      <!-- 1. 按功課管理 (恢復舊版功能：選擇功課 + 一鍵切換學生狀態 + 分數輸入 + 順序調整) -->
      <div x-show="currentTab === 'homework'" class="space-y-6">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex items-center space-x-3">
              <h2 class="text-lg font-bold">功課清單</h2>
              <button @click="addHomeworkPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-md font-medium">+ 新增功課</button>
            </div>
          </div>

          <!-- 功課卡片列表 (帶順序調整按鈕 ⬆️ ⬇️) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            <template x-for="(hw, hIdx) in currentHomeworks" :key="hw.id">
              <div @click="selectedHomeworkId = hw.id"
                   :class="selectedHomeworkId === hw.id ? 'border-indigo-600 bg-indigo-50/50 dark:bg-indigo-950/30 ring-2 ring-indigo-500/20' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/30'"
                   class="p-3 rounded-xl border cursor-pointer transition flex items-center justify-between">
                <div>
                  <span class="text-xs font-mono bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded font-bold" x-text="`#${hIdx + 1}`"></span>
                  <p class="font-bold text-sm mt-1" x-text="hw.title"></p>
                </div>
                <div class="flex items-center space-x-1" @click.stop>
                  <button @click="moveHomework(hIdx, -1)" :disabled="hIdx === 0" class="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 text-xs">⬆️</button>
                  <button @click="moveHomework(hIdx, 1)" :disabled="hIdx === currentHomeworks.length - 1" class="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 text-xs">⬇️</button>
                  <button @click="deleteHomework(hw.id)" class="text-xs text-red-500 hover:underline ml-1">刪除</button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 當前選中功課的學生批改狀態表格 -->
        <template x-if="getSelectedHomework()">
          <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
            <h3 class="font-bold text-md mb-3 flex items-center space-x-2">
              <span>📝 正在登記：</span>
              <span class="text-indigo-600 dark:text-indigo-400" x-text="getSelectedHomework().title"></span>
            </h3>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
                    <th class="py-2 px-3">學號</th>
                    <th class="py-2 px-3">姓名</th>
                    <th class="py-2 px-3">繳交狀態 (點擊快速切換)</th>
                    <template x-if="enableHwsScores">
                      <th class="py-2 px-3">功課分數</th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="student in getSortedStudents()" :key="student.id">
                    <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30">
                      <td class="py-2.5 px-3 font-mono text-slate-500" x-text="student.no || '-'"></td>
                      <td class="py-2.5 px-3 font-medium" x-text="student.name"></td>
                      <td class="py-2.5 px-3">
                        <!-- 狀態切換按鈕 (已交 / 待改正 / 未交) -->
                        <div class="flex items-center space-x-2">
                          <button @click="setStatus(student.id, selectedHomeworkId, 'submitted')"
                                  :class="getStatus(student.id, selectedHomeworkId) === 'submitted' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-emerald-100'"
                                  class="px-2.5 py-1 rounded-md text-xs font-medium transition">🟢 已交</button>
                          <button @click="setStatus(student.id, selectedHomeworkId, 'correction')"
                                  :class="getStatus(student.id, selectedHomeworkId) === 'correction' ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-amber-100'"
                                  class="px-2.5 py-1 rounded-md text-xs font-medium transition">🟡 待改正</button>
                          <button @click="setStatus(student.id, selectedHomeworkId, 'missing')"
                                  :class="getStatus(student.id, selectedHomeworkId) === 'missing' ? 'bg-red-600 text-white shadow' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-red-100'"
                                  class="px-2.5 py-1 rounded-md text-xs font-medium transition">🔴 未交</button>
                        </div>
                      </td>
                      <template x-if="enableHwsScores">
                        <td class="py-2.5 px-3">
                          <input type="number" 
                                 :value="getScore(student.id, selectedHomeworkId)"
                                 @change="setScore(student.id, selectedHomeworkId, $event.target.value)"
                                 placeholder="分數" 
                                 class="w-20 px-2 py-1 border rounded text-sm dark:bg-slate-700 dark:border-slate-600">
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>

      <!-- 2. 學生整體總覽 (Tooltip z-50 遮擋修復 + 編輯與批量新增學生) -->
      <div x-show="currentTab === 'overview'" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold" x-text="`${currentClass} 班學生交功課整體情況`"></h2>
          <button @click="showStudentModal = true" class="text-xs bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-100 px-3 py-1.5 rounded-md font-medium">✏️ 編輯學生與學號</button>
        </div>

        <div class="overflow-visible">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
                <th class="py-2 px-3">學號</th>
                <th class="py-2 px-3">姓名</th>
                <th class="py-2 px-3">未交數量</th>
                <th class="py-2 px-3">待改正</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(student, sIdx) in getSortedStudents()" :key="student.id">
                <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30">
                  <td class="py-2.5 px-3 font-mono text-slate-500" x-text="student.no || (sIdx + 1)"></td>
                  <td class="py-2.5 px-3 font-medium" x-text="student.name"></td>
                  <!-- 未交數量與彈出提示 (修復遮擋問題：z-50) -->
                  <td class="py-2.5 px-3 relative group">
                    <span class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-bold rounded-full bg-red-100 text-red-600 dark:bg-red-950 dark:text-red-300 cursor-pointer"
                          x-text="getMissingHomeworks(student.id).length"></span>
                    <div class="hidden group-hover:block absolute left-0 top-full mt-1 w-52 bg-slate-900 text-white text-xs rounded-lg p-2.5 shadow-2xl z-50 pointer-events-none">
                      <p class="font-bold border-b border-slate-700 pb-1 mb-1">未交功課清單：</p>
                      <template x-if="getMissingHomeworks(student.id).length === 0">
                        <p class="text-slate-400">已全部繳交 ✨</p>
                      </template>
                      <ul class="list-disc list-inside space-y-0.5 text-slate-200">
                        <template x-for="hw in getMissingHomeworks(student.id)" :key="hw.id">
                          <li x-text="hw.title"></li>
                        </template>
                      </ul>
                    </div>
                  </td>
                  <td class="py-2.5 px-3 text-slate-400" x-text="getCorrectionHomeworks(student.id).length"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 3. 測驗成績分析 (儀表板 + 恢復學生測驗成績登記表) -->
      <div x-show="currentTab === 'quiz'" class="space-y-6">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex items-center space-x-3">
              <h2 class="text-lg font-bold">整體成績分析儀表板</h2>
              <div class="flex items-center space-x-1 text-xs">
                <span class="text-slate-500">測驗滿分：</span>
                <input type="number" x-model.number="quizMaxScore" @change="saveDataToFirebase()" class="w-16 px-2 py-0.5 border rounded text-xs dark:bg-slate-700">
              </div>
            </div>
            <button @click="showQuizConfigModal = true" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-md font-medium">⚙️ 設定合格與等級標準</button>
          </div>

          <!-- 數據指標卡片 (顯示百分比平均分) -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="p-4 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50">
              <p class="text-xs text-indigo-500 font-medium">全班平均分</p>
              <p class="text-xl font-bold text-indigo-700 dark:text-indigo-300 mt-1" x-text="`${quizStats.avg} 分 (${quizStats.avgPct}%)`"></p>
            </div>
            <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/50">
              <p class="text-xs text-emerald-500 font-medium" x-text="`及格率 (≥${quizConfig.passPct}%)`"></p>
              <p class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1" x-text="`${quizStats.passRate}%`"></p>
            </div>
            <div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-100 dark:border-amber-900/50">
              <p class="text-xs text-amber-500 font-medium">最高分 / 最低分</p>
              <p class="text-xl font-bold text-amber-700 dark:text-amber-300 mt-1" x-text="`${quizStats.max} / ${quizStats.min}`"></p>
            </div>
            <div class="p-4 rounded-xl bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600">
              <p class="text-xs text-slate-500 font-medium">已登記人數</p>
              <p class="text-2xl font-bold mt-1" x-text="`${quizStats.count} 人`"></p>
            </div>
          </div>

          <!-- 等級分佈統計 -->
          <p class="text-xs text-slate-400 font-medium mb-2">等級分佈統計：</p>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-xs">
            <div class="p-2.5 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200">
              <p class="font-semibold" x-text="`優秀 (≥${quizConfig.excellent}%)`"></p>
              <p class="text-lg font-bold mt-1" x-text="`${quizStats.grades.excellent} 人`"></p>
            </div>
            <div class="p-2.5 rounded-lg bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-200">
              <p class="font-semibold" x-text="`良好 (${quizConfig.good}-${quizConfig.excellent-1}%)`"></p>
              <p class="text-lg font-bold mt-1" x-text="`${quizStats.grades.good} 人`"></p>
            </div>
            <div class="p-2.5 rounded-lg bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-200">
              <p class="font-semibold" x-text="`中等 (${quizConfig.average}-${quizConfig.good-1}%)`"></p>
              <p class="text-lg font-bold mt-1" x-text="`${quizStats.grades.average} 人`"></p>
            </div>
            <div class="p-2.5 rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-200">
              <p class="font-semibold" x-text="`及格 (${quizConfig.passPct}-${quizConfig.average-1}%)`"></p>
              <p class="text-lg font-bold mt-1" x-text="`${quizStats.grades.pass} 人`"></p>
            </div>
            <div class="p-2.5 rounded-lg bg-red-100 dark:bg-red-950 text-red-800 dark:text-red-200">
              <p class="font-semibold" x-text="`不及格 (<${quizConfig.passPct}%)`"></p>
              <p class="text-lg font-bold mt-1" x-text="`${quizStats.grades.fail} 人`"></p>
            </div>
          </div>
        </div>

        <!-- 恢復：學生測驗成績登記表 -->
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
          <h3 class="font-bold text-md mb-3">💯 全班學生測驗成績登記</h3>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
                <th class="py-2 px-3">學號</th>
                <th class="py-2 px-3">姓名</th>
                <th class="py-2 px-3">測驗得分</th>
                <th class="py-2 px-3">百分比</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="student in getSortedStudents()" :key="student.id">
                <tr class="border-b border-slate-100 dark:border-slate-700/50">
                  <td class="py-2 px-3 font-mono text-slate-500" x-text="student.no || '-'"></td>
                  <td class="py-2 px-3 font-medium" x-text="student.name"></td>
                  <td class="py-2 px-3">
                    <input type="number" 
                           :value="quizScores[student.id] !== undefined ? quizScores[student.id] : ''"
                           @input="updateQuizScore(student.id, $event.target.value)"
                           placeholder="輸入分數" 
                           class="w-24 px-2 py-1 border rounded text-sm dark:bg-slate-700 dark:border-slate-600">
                  </td>
                  <td class="py-2 px-3 font-mono text-slate-500">
                    <span x-text="quizScores[student.id] !== undefined ? `${((quizScores[student.id] / quizMaxScore) * 100).toFixed(1)}%` : '-'"></span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 4. 課堂紀錄與事件模組 -->
      <div x-show="currentTab === 'incidents'" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">📋 課堂事件與欠帶紀錄</h2>
          <div class="space-x-2">
            <button @click="showCategoryModal = true" class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-md font-medium">⚙️ 事件模組設定</button>
            <button @click="showIncidentModal = true" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-md font-medium">+ 登記新事件</button>
          </div>
        </div>

        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400">
              <th class="py-2 px-3">日期</th>
              <th class="py-2 px-3">學生</th>
              <th class="py-2 px-3">事件項目</th>
              <th class="py-2 px-3">備註說明</th>
              <th class="py-2 px-3">操作</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="log in currentIncidents" :key="log.id">

  <!-- JavaScript 與 Firebase 邏輯 -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5YYncT7-6_003kZh1Iq0zoreOVk2og50",
      authDomain: "homework-tracker-971ef.firebaseapp.com",
      projectId: "homework-tracker-971ef",
      storageBucket: "homework-tracker-971ef.firebasestorage.app",
      messagingSenderId: "640761164042",
      appId: "1:640761164042:web:097643fafa0e943831caf3",
      measurementId: "G-W3Y7MH62EC"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function app() {
      return {
        user: null,
        isDarkMode: false,
        currentTab: 'homework',
        classes: ['3A', '3B'],
        currentClass: '3A',
        newClassName: '',
        enableHwsScores: false, // 功課分數開關
        selectedHomeworkId: null,

        presetCategories: ['未帶計算機', '未帶課本', '未帶功課', '課堂生事', '遲到'],
        newCategoryName: '',

        showClassModal: false,
        showCategoryModal: false,
        showStudentModal: false,
        showBatchModal: false,
        showQuizConfigModal: false,
        showIncidentModal: false,

        batchInputText: '',
        quizConfig: { passPct: 60, excellent: 90, good: 80, average: 70 },

        students: [
          { id: 's1', class: '3A', no: '01', name: '張小明' },
          { id: 's2', class: '3A', no: '02', name: '李大衛' }
        ],
        homeworks: [
          { id: 'h1', class: '3A', title: '數學工作紙 (一)' }
        ],
        records: {}, // 支援舊版字串或新版物件 { status, score }
        quizScores: {},
        quizMaxScore: 20,
        incidents: [],

        newIncident: { studentId: '', date: new Date().toISOString().split('T')[0], category: '未帶計算機', note: '' },

        initApp() {
          if (localStorage.getItem('theme') === 'dark') {
            this.isDarkMode = true;
            document.documentElement.classList.add('dark');
          }

          auth.onAuthStateChanged(u => {
            this.user = u;
            if (u) {
              this.loadDataFromFirebase();
            }
          });
        },

        loginGoogle() {
          const provider = new firebase.auth.GoogleAuthProvider();
          auth.signInWithPopup(provider).catch(e => alert("登入失敗: " + e.message));
        },

        logoutGoogle() {
          auth.signOut();
        },

        async loadDataFromFirebase() {
          if (!this.user) return;
          try {
            const doc = await db.collection('homework_trackers').doc(this.user.uid).get();
            if (doc.exists) {
              const data = doc.data();
              if (data.classes) this.classes = data.classes;
              if (data.enableHwsScores !== undefined) this.enableHwsScores = data.enableHwsScores;
              if (data.presetCategories) this.presetCategories = data.presetCategories;
              if (data.quizConfig) this.quizConfig = data.quizConfig;
              if (data.quizMaxScore) this.quizMaxScore = data.quizMaxScore;
              if (data.students) this.students = data.students;
              if (data.homeworks) this.homeworks = data.homeworks;
              if (data.records) this.records = data.records;
              if (data.quizScores) this.quizScores = data.quizScores;
              if (data.incidents) this.incidents = data.incidents;

              // 自動預選第一項功課
              if (this.currentHomeworks.length > 0) {
                this.selectedHomeworkId = this.currentHomeworks[0].id;
              }
            }
          } catch (e) {
            console.error("載入失敗", e);
          }
        },

        async saveDataToFirebase() {
          if (!this.user) return;
          try {
            await db.collection('homework_trackers').doc(this.user.uid).set({
              classes: this.classes,
              enableHwsScores: this.enableHwsScores,
              presetCategories: this.presetCategories,
              quizConfig: this.quizConfig,
              quizMaxScore: this.quizMaxScore,
              students: this.students,
              homeworks: this.homeworks,
              records: this.records,
              quizScores: this.quizScores,
              incidents: this.incidents
            }, { merge: true });
          } catch (e) {
            console.error("同步失敗", e);
          }
        },

        toggleDarkMode() {
          this.isDarkMode = !this.isDarkMode;
          if (this.isDarkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },

        addClass() {
          if (this.newClassName && !this.classes.includes(this.newClassName)) {
            this.classes.push(this.newClassName);
            this.currentClass = this.newClassName;
            this.newClassName = '';
            this.saveDataToFirebase();
          }
        },

        removeClass(cls) {
          if (this.classes.length <= 1) return alert('至少需保留一個班別');
          this.classes = this.classes.filter(c => c !== cls);
          if (this.currentClass === cls) this.currentClass = this.classes[0];
          this.saveDataToFirebase();
        },

        addCategory() {
          if (this.newCategoryName && !this.presetCategories.includes(this.newCategoryName)) {
            this.presetCategories.push(this.newCategoryName);
            this.newCategoryName = '';
            this.saveDataToFirebase();
          }
        },

        removeCategory(idx) {
          this.presetCategories.splice(idx, 1);
          this.saveDataToFirebase();
        },

        get currentStudents() {
          return this.students.filter(s => s.class === this.currentClass);
        },

        getSortedStudents() {
          return [...this.currentStudents].sort((a, b) => parseInt(a.no || 0) - parseInt(b.no || 0));
        },

        get currentHomeworks() {
          return this.homeworks.filter(h => h.class === this.currentClass);
        },

        getSelectedHomework() {
          return this.homeworks.find(h => h.id === this.selectedHomeworkId) || this.currentHomeworks[0];
        },

        addHomeworkPrompt() {
          const title = prompt('請輸入功課名稱：');
          if (title) {
            const newHw = { id: 'h_' + Date.now(), class: this.currentClass, title };
            this.homeworks.push(newHw);
            this.selectedHomeworkId = newHw.id;
            this.saveDataToFirebase();
          }
        },

        deleteHomework(id) {
          this.homeworks = this.homeworks.filter(h => h.id !== id);
          if (this.selectedHomeworkId === id && this.currentHomeworks.length > 0) {
            this.selectedHomeworkId = this.currentHomeworks[0].id;
          }
          this.saveDataToFirebase();
        },

        moveHomework(idx, dir) {
          const classHws = this.currentHomeworks;
          const target = classHws[idx];
          const swapTarget = classHws[idx + dir];
          if (!swapTarget) return;

          const mainIdx1 = this.homeworks.indexOf(target);
          const mainIdx2 = this.homeworks.indexOf(swapTarget);

          this.homeworks[mainIdx1] = swapTarget;
          this.homeworks[mainIdx2] = target;
          this.saveDataToFirebase();
        },

        // 功課狀態與分數處理 (兼容舊版字串與新版物件)
        getStatus(studentId, hwId) {
          const key = `${studentId}_${hwId}`;
          const rec = this.records[key];
          if (!rec) return 'missing'; // 預設未交
          return typeof rec === 'object' ? rec.status : rec;
        },

        setStatus(studentId, hwId, status) {
          const key = `${studentId}_${hwId}`;
          const current = this.records[key];
          const score = typeof current === 'object' ? current.score : null;
          this.records[key] = { status, score };
          this.saveDataToFirebase();
        },

        getScore(studentId, hwId) {
          const key = `${studentId}_${hwId}`;
          const rec = this.records[key];
          return (typeof rec === 'object' && rec.score !== undefined) ? rec.score : '';
        },

        setScore(studentId, hwId, score) {
          const key = `${studentId}_${hwId}`;
          const currentStatus = this.getStatus(studentId, hwId);
          this.records[key] = { status: currentStatus, score: score !== '' ? Number(score) : null };
          this.saveDataToFirebase();
        },

        getMissingHomeworks(studentId) {
          return this.currentHomeworks.filter(hw => this.getStatus(studentId, hw.id) === 'missing');
        },

        getCorrectionHomeworks(studentId) {
          return this.currentHomeworks.filter(hw => this.getStatus(studentId, hw.id) === 'correction');
        },

        // 測驗成績更新
        updateQuizScore(studentId, val) {
          if (val === '') {
            delete this.quizScores[studentId];
          } else {
            this.quizScores[studentId] = Number(val);
          }
          this.saveDataToFirebase();
        },

        get quizStats() {
          const scores = this.currentStudents.map(s => this.quizScores[s.id]).filter(v => v !== undefined && v !== '');
          if (scores.length === 0) return { avg: 0, avgPct: '0.0', passRate: 0, max: 0, min: 0, count: 0, grades: { excellent: 0, good: 0, average: 0, pass: 0, fail: 0 } };

          const sum = scores.reduce((a, b) => a + b, 0);
          const avg = (sum / scores.length).toFixed(1);
          const avgPct = ((avg / this.quizMaxScore) * 100).toFixed(1);
          const passScore = (this.quizMaxScore * this.quizConfig.passPct) / 100;
          const passCount = scores.filter(s => s >= passScore).length;

          const grades = { excellent: 0, good: 0, average: 0, pass: 0, fail: 0 };
          scores.forEach(s => {
            const pct = (s / this.quizMaxScore) * 100;
            if (pct >= this.quizConfig.excellent) grades.excellent++;
            else if (pct >= this.quizConfig.good) grades.good++;
            else if (pct >= this.quizConfig.average) grades.average++;
            else if (pct >= this.quizConfig.passPct) grades.pass++;
            else grades.fail++;
          });

          return {
            avg,
            avgPct,
            passRate: Math.round((passCount / scores.length) * 100),
            max: Math.max(...scores),
            min: Math.min(...scores),
            count: scores.length,
            grades
          };
        },

        get currentIncidents() {
          const studentIds = this.currentStudents.map(s => s.id);
          return this.incidents.filter(i => studentIds.includes(i.studentId));
        },

        getStudentName(id) {
          const s = this.students.find(st => st.id === id);
          return s ? `${s.no || ''} ${s.name}` : '未知學生';
        },

        addNewStudentInput() {
          this.students.push({ id: 's_' + Date.now(), class: this.currentClass, no: '', name: '' });
        },

        removeStudent(id) {
          this.students = this.students.filter(s => s.id !== id);
        },

        // 恢復：批量貼上學生處理邏輯
        processBatchStudents() {
          if (!this.batchInputText.trim()) return;
          const lines = this.batchInputText.split('\n');
          lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const parts = trimmed.split(/\s+/);
            let no = '';
            let name = trimmed;
            if (parts.length > 1 && !isNaN(parts[0])) {
              no = parts[0];
              name = parts.slice(1).join(' ');
            }
            this.students.push({ id: 's_' + Date.now() + Math.random().toString(36).substr(2, 4), class: this.currentClass, no, name });
          });
          this.batchInputText = '';
          this.showBatchModal = false;
          this.saveDataToFirebase();
        },

        saveIncident() {
          if (!this.newIncident.studentId) return;
          this.incidents.push({ id: 'inc_' + Date.now(), ...this.newIncident });
          this.showIncidentModal = false;
          this.newIncident.note = '';
          this.saveDataToFirebase();
        },

        deleteIncident(id) {
          this.incidents = this.incidents.filter(i => i.id !== id);
          this.saveDataToFirebase();
        },

        exportToExcel() {
          const wb = XLSX.utils.book_new();

          const hwData = this.currentStudents.map(s => ({
            '學號': s.no || '',
            '姓名': s.name,
            '未交功課數': this.getMissingHomeworks(s.id).length,
            '測驗分數': this.quizScores[s.id] !== undefined ? this.quizScores[s.id] : ''
          }));
          const ws1 = XLSX.utils.json_to_sheet(hwData);
          XLSX.utils.book_append_sheet(wb, ws1, "功課與測驗");

          const incData = this.currentIncidents.map(i => ({
            '日期': i.date,
            '學生': this.getStudentName(i.studentId),
            '事件項目': i.category,
            '備註': i.note
          }));
          const ws2 = XLSX.utils.json_to_sheet(incData);
          XLSX.utils.book_append_sheet(wb, ws2, "課堂紀錄");

          XLSX.writeFile(wb, `課堂管理系統報表_${this.currentClass}.xlsx`);
        }
      }
    }
  </script>
</body>
